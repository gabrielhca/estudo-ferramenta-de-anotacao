schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Aplicação desktop offline-first para curadoria e anotação de imagens, com suporte a múltiplos especialistas.
  Stack:
  - Python
  - PySide6/QML
  - SQLite
  - pytest
  Arquitetura:
  - UI
  - Services
  - Domain
  - Repositories (interfaces)
  - Storage (implementa os Repositories)
  Regras:
  - Offline-first: sem dependência de internet ou serviços em nuvem.
  - Somente o Storage acessa o SQLite; a persistência passa pelos Repositories.
  - Regras de negócio não ficam na UI.
  - Perguntas e classes vêm da configuração do coordenador, nunca fixas no código.
  - Escrever os artefatos em português (PT-BR); identificadores de código em inglês.
  - Não inventar requisitos; dúvidas viram "Questões em aberto".

rules:
  proposal:
    - Liste na seção Why os IDs das histórias de usuário cobertas (por exemplo US01, US02).
    - Inclua em What Changes um item "Fora de escopo" com o que fica para outras changes.
    - Use somente nomes de capacidade do mapa de capacidades; se nenhum servir, diga isso explicitamente e proponha o novo nome.
  specs:
    - 'Termine o nome de cada requisito com o ID da US de origem entre parênteses, por exemplo "Criar projeto (US01)".'
    - Cada critério de aceitação aprovado na exploração MUST virar ao menos um Scenario.
    - Inclua cenários de erro/validação (entrada inválida, item inexistente), não só o caminho feliz.
    - Não mencione tecnologia, framework, classe ou tabela.
  design:
    - Registre formatos de arquivo (pacote, exportação, anotações) como decisões explícitas com alternativas.
    - Se a change não exigir decisões novas, mantenha o design curto e diga "segue os padrões existentes".
  tasks:
    - Cada tarefa MUST caber em uma única conversa de implementação (alvo de até ~1h de trabalho).
    - Cada tarefa MUST citar o(s) Scenario(s) da spec que ela atende e como verificar (teste ou comando).
    - Escreva o teste junto da tarefa que implementa o comportamento, não em um grupo final.

operations:
  apply:
    guidance:
      - Implemente uma única tarefa por vez e pare para revisão humana.
  archive:
    guidance:
      - Só arquive depois que todos os testes passarem e os cenários da spec forem conferidos.